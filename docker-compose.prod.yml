version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: jd-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: jd-agent-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./src/web/jd-chat-ui
      dockerfile: ../../../Dockerfile.frontend
    container_name: jd-agent-frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
  app_data:
