version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: jd-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jd-agent-backend-dev
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./src/app:/app/src/app
      - ./src/prompts:/app/src/prompts
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  frontend:
    build:
      context: ./src/web/jd-chat-ui
      dockerfile: ../../../Dockerfile.frontend.dev
    container_name: jd-agent-frontend-dev
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - ./src/web/jd-chat-ui/src:/app/src
      - ./src/web/jd-chat-ui/public:/app/public
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
